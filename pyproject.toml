[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "suffml"
version = "0.1.0"
description = "Sufficiency-aware representation learning for microstructure-to-failure prediction"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas", "matplotlib", "pyyaml"]

[project.optional-dependencies]
torch = ["torch"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests", "torch: require PyTorch"]
